services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: atop
      POSTGRES_PASSWORD: atop
      POSTGRES_DB: atopbank
    ports:
      - "5432:5432"
    volumes:
      - atopbank_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atop -d atopbank"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  atopbank_pg:
