<!DOCTYPE html>
<html>
<head>
    <title>Test Converter</title>
</head>
<body>
<textarea id="input" style="width:100%;height:400px;">&lt;!doctype html&gt;
&lt;html lang="en"&gt;
  &lt;head&gt;
    &lt;meta charset="UTF-8"&gt;
    &lt;title&gt;John Doe — Developer Portfolio&lt;/title&gt;
  &lt;/head&gt;
  &lt;body&gt;
    &lt;h1&gt;John Doe&lt;/h1&gt;
    &lt;p&gt;Full-Stack Developer&lt;/p&gt;
  &lt;/body&gt;
&lt;/html&gt;</textarea>
<br>
<button onclick="test()">Convert to Markdown</button>
<pre id="output"></pre>

<script type="module">
    import { htmlToMarkdown, saveHtmlAsMarkdown } from './md.js';

    window.test = function() {
        const html = document.getElementById('input').value;
        const markdown = htmlToMarkdown(html);
        document.getElementById('output').textContent = markdown;
        saveHtmlAsMarkdown(html, 'test.md');
    };
</script>
</body>
</html>
