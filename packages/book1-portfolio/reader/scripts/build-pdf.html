<!DOCTYPE html>
<html>
<head>
    <title>Generating PDF...</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; text-align: center; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<h1>📚 Generating PDF...</h1>
<div class="spinner"></div>
<p>This may take a minute. Please wait...</p>
<div id="output" style="text-align: left; margin: 20px; padding: 10px; background: #f5f5f5; border-radius: 5px;"></div>

<script>
    async function runBuild() {
        try {
            const response = await fetch('./build-pdf.js?run=true');
            const scriptContent = await response.text();

            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = '<pre>' + scriptContent.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</pre>';

            const moduleResponse = await fetch('./build-pdf.js');
            const moduleText = await moduleResponse.text();

            const blob = new Blob([moduleText], { type: 'application/javascript' });
            const url = URL.createObjectURL(blob);

            const module = await import(url);

            setTimeout(() => {
                window.location.href = '../../export/book.pdf';
            }, 3000);

        } catch (error) {
            document.getElementById('output').innerHTML =
                '<p style="color: red;">Error: ' + error.message + '</p>' +
                '<p>Try running in terminal: <code>node build-pdf.js</code></p>';
        }
    }

    runBuild();
</script>
</body>
</html>
