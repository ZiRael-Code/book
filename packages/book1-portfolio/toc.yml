book:
  title: "HTML, CSS & Tailwind: A Beginner's Journey"
  subtitle: "From Zero to Responsive Websites"
  author: "The Learning Team"
  description: "A hands-on guide to modern web development for absolute beginners"

chapters:
  - id: "read-me-first"
    title: "Read Me First"
    order: 0
    path: "chapters/00-read-me-first.md"
    code: "code/00-read-me-first/"
    time: "10 min"
    subtitle: "Welcome to your learning journey. Let's start by understanding how this book works."

  - id: "project-setup"
    title: "Project Setup & Tools"
    order: 1
    path: "chapters/01-project-setup.md"
    code: "code/01-project-setup/"
    time: "15 min"
    subtitle: "Set up your development environment and tools"

  - id: "html-header"
    title: "Building HTML Header"
    order: 2
    path: "chapters/02-html-header.md"
    code: "code/02-html-header/"
    time: "20 min"
    subtitle: "Create the header section of your portfolio"

  - id: "hero-section"
    title: "Creating a Hero Section"
    order: 3
    path: "chapters/03-hero-section.md"
    code: "code/03-hero-section/"
    time: "25 min"
    subtitle: "Create the hero section of your portfolio"

  - id: "css-basics"
    title: "CSS Fundamentals"
    order: 4
    path: "chapters/04-css-basics.md"
    code: "code/04-css-basics/"
    time: "30 min"
    subtitle: "Learn CSS fundamentals and styling"

  - id: "tailwind-layout"
    title: "Tailwind Layout & Utilities"
    order: 5
    path: "chapters/05-tailwind-layout.md"
    code: "code/05-tailwind-layout/"
    time: "35 min"
    subtitle: "Master Tailwind CSS layout and utilities"

  - id: "responsive-design"
    title: "Responsive Design"
    order: 6
    path: "chapters/06-responsive-design.md"
    code: "code/06-responsive-design/"
    time: "40 min"
    subtitle: "Create responsive websites that work on all devices"

  - id: "final-notes"
    title: "Final Notes & Next Steps"
    order: 7
    path: "chapters/07-final-notes.md"
    code: "code/07-final-notes/"
    time: "10 min"
    subtitle: "Wrap up and continue your learning journey"

export:
  pdf:
    output: "export/book.pdf"
    template: "templates/pdf.latex"

  html:
    output: "export/book.html"
    template: "templates/html.html"